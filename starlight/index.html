<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Project Starlight v0.5.1</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;box-shadow:0 0 60px rgba(120,60,255,.15)}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  #credit{position:absolute;left:0;right:0;bottom:0.6%;text-align:center;font:500 clamp(9px,1.7vmin,14px)/1.2 system-ui,sans-serif;color:rgba(220,210,255,.75);text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none}
  #credit a{color:#ff8fe0;pointer-events:auto;text-decoration:none}
  #credit a:hover{text-decoration:underline}
  #credit .more{font-size:.8em;opacity:.85}
  #rotate{display:none;position:absolute;left:5%;right:5%;bottom:8%;text-align:center;font:600 min(4.2vw,18px)/1.4 "Courier New",monospace;color:#7fc4ff;text-shadow:0 0 8px #3a8cff;pointer-events:none}
  @media (orientation:portrait) and (pointer:coarse){ #rotate{display:block} }
  #nameEntry{display:none;position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);gap:calc(var(--u,1px)*14);align-items:center}
  #nameEntry input{width:calc(var(--u,1px)*300);font:bold max(16px,calc(var(--u,1px)*30)) "Courier New",monospace;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:#ffe9ff;background:rgba(10,4,26,.85);border:2px solid #ff50dc;border-radius:8px;padding:calc(var(--u,1px)*8);outline:none;box-shadow:0 0 14px #ff50dc,inset 0 0 10px rgba(255,80,220,.35);caret-color:#ffdc5a}
  #nameEntry input:focus{border-color:#ffdc5a;box-shadow:0 0 18px #ffdc5a,inset 0 0 10px rgba(255,220,90,.3)}
  #nameEntry button{font:bold max(14px,calc(var(--u,1px)*20)) "Courier New",monospace;color:#bfe0ff;background:rgba(10,4,26,.85);border:2px solid #46a0ff;border-radius:8px;padding:calc(var(--u,1px)*12) calc(var(--u,1px)*18);box-shadow:0 0 14px #46a0ff;cursor:pointer;touch-action:manipulation}
  #nameEntry button:active{background:rgba(70,160,255,.3)}
  noscript{color:#fff;font-family:sans-serif}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" tabindex="0"></canvas>
  <div id="credit">Music: <a href="https://opengameart.org/content/angel-eyes-vision-ii" target="_blank" rel="noopener">"Angel Eyes (Vision II)"</a> by Kim Lightyear (KLY) — <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC-BY-SA</a><br><span class="more">Story: <a href="https://opengameart.org/content/the-last-encounter-matthew-pablo-zefz-neocrey" target="_blank" rel="noopener">"The Last Encounter"</a> mix by Matthew Pablo, Zefz &amp; neocrey (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC-BY-SA 3.0</a>) · <a href="https://opengameart.org/users/centurionofwar" target="_blank" rel="noopener">"HellDrake"</a> by Centurion_of_war (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC-BY 4.0</a>)</span></div>
</div>
<div id="rotate">&#8635; Rotate your phone for the best experience</div>

</body>
</html>

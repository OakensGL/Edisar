<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Last Station">
<meta name="description" content="Hold the line against Commander Edisar's fleet. A Project Starlight tower defense.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Starlight: Last Station v0.2.1</title>
<style>
  html{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
  html,body{margin:0;height:100%;height:100dvh;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;box-shadow:0 0 60px rgba(120,60,255,.15)}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  #credit{position:absolute;left:0;right:0;bottom:0.8%;text-align:center;font:500 clamp(9px,1.7vmin,13px)/1.3 system-ui,sans-serif;color:rgba(220,210,255,.7);text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none}
  #rotate{display:none;position:absolute;left:5%;right:5%;bottom:max(8%,calc(env(safe-area-inset-bottom,0px) + 8px));text-align:center;font:600 min(4.2vw,18px)/1.4 "Courier New",monospace;color:#7fc4ff;text-shadow:0 0 8px #3a8cff;pointer-events:none}
  @media (orientation:portrait) and (pointer:coarse){ #rotate{display:block} }
  #installTip{display:none;position:fixed;left:50%;bottom:max(12px,calc(env(safe-area-inset-bottom,0px) + 8px));transform:translateX(-50%);z-index:30;max-width:min(420px,calc(100% - 24px));align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:10px;background:rgba(8,4,20,0.92);border:1px solid rgba(80,170,255,0.55);box-shadow:0 0 16px rgba(80,170,255,0.25);color:#d8f0ff;font:600 13px/1.3 system-ui,sans-serif;text-shadow:0 0 6px #000}
  #installTip.show{display:flex}
  #installTip #installMsg{flex:1;min-width:0}
  #installTip button{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#d8f0ff;font:700 18px/1 system-ui,sans-serif;padding:4px 6px;cursor:pointer;touch-action:manipulation}
  #installTip #installBtn{border:1px solid rgba(80,170,255,0.8);border-radius:8px;background:rgba(40,80,160,0.45);font:700 13px/1.2 system-ui,sans-serif;padding:7px 10px;color:#eaf6ff;box-shadow:0 0 8px rgba(80,170,255,0.35)}
  #installTip #installDismiss{opacity:0.85;font-size:20px}
  noscript{color:#fff;font-family:sans-serif}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" tabindex="0"></canvas>
  <div id="credit">Title: <a href="https://opengameart.org/content/space-dimensions-8bitretro-version" target="_blank" rel="noopener">Matthew Pablo</a> · Game: <a href="https://opengameart.org/content/space-shooter-music" target="_blank" rel="noopener">Oblidivm</a> — <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC-BY 3.0</a></div>
</div>
<div id="rotate">&#8635; Rotate your phone for the best experience</div>
<noscript>Starlight: Last Station needs JavaScript.</noscript>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
